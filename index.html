<style>
/* Globe-specific styles */
#threatGlobeCanvas { position: absolute; inset: 0; cursor: grab; }
#threatGlobeCanvas:active { cursor: grabbing; }
.globe-wrap { position: relative; width: 100%; height: 640px; background: radial-gradient(ellipse at center, #0a1628 0%, #000 100%); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
.globe-hud { position: absolute; pointer-events: none; z-index: 10; font-family: 'Courier New', monospace; color: #4ade80; text-shadow: 0 0 8px rgba(74,222,128,0.6); }
.hud-tl { top: 16px; left: 16px; }
.hud-tr { top: 16px; right: 16px; text-align: right; }
.hud-bl { bottom: 16px; left: 16px; max-width: 380px; pointer-events: auto; }
.hud-br { bottom: 16px; right: 16px; pointer-events: auto; display: flex; gap: 6px; }
.hud-title { font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #4ade80; margin-bottom: 4px; }
.hud-sub { font-size: 10px; color: #86efac; letter-spacing: 1px; }
.hud-stat { font-size: 22px; font-weight: bold; color: #4ade80; line-height: 1; }
.hud-stat-label { font-size: 9px; color: #86efac; letter-spacing: 1px; margin-top: 2px; }
.hud-stat-row { display: flex; gap: 20px; }
.threat-feed { max-height: 180px; overflow: hidden; font-size: 11px; line-height: 1.6; }
.threat-feed-item { opacity: 0; animation: feedIn 0.4s forwards; padding: 2px 0; color: #fbbf24; }
@keyframes feedIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
.threat-feed-item .src { color: #f87171; }
.threat-feed-item .dst { color: #60a5fa; }
.threat-feed-item .cve { color: #fbbf24; }
.hud-btn { background: rgba(10,22,40,0.8); border: 1px solid #4ade80; color: #4ade80; padding: 6px 10px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; }
.hud-btn:hover { background: rgba(74,222,128,0.15); }
.globe-webgl-fallback { display: flex; align-items: center; justify-content: center; height: 100%; color: #4ade80; font-family: 'Courier New', monospace; }
body.warroom .sidebar, body.warroom .header { display: none !important; }
body.warroom .main-content { margin-left: 0 !important; }
body.warroom .page-content { padding: 0; }
body.warroom .globe-wrap { height: 100vh; border-radius: 0; border: none; }
.scanline { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(74,222,128,0.4), transparent); animation: scan 4s linear infinite; pointer-events: none; z-index: 5; }
@keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
</style>
</head>
